name: Rosalía Spotify Tracker

# Triggered every 15 minutes by an external cron-job.org job (repository_dispatch),
# or manually from the Actions tab (workflow_dispatch).
on:
  repository_dispatch:
    types: [check_spotify]
  workflow_dispatch:

concurrency:
  group: tracker
  cancel-in-progress: false

jobs:
  update-tracker:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      # No setup-node step: the runner already ships a Node version with built-in fetch.
      - name: Fetch Spotify Data and Update Stats
        id: tracker
        env:
          SPOTIFY_CLIENT_ID: ${{ secrets.SPOTIFY_CLIENT_ID }}
          SPOTIFY_CLIENT_SECRET: ${{ secrets.SPOTIFY_CLIENT_SECRET }}
          SPOTIFY_REFRESH_TOKEN: ${{ secrets.SPOTIFY_REFRESH_TOKEN }}
        run: |
          node -e '
          const fs = require("fs");

          const ROSALIA_ID = "7ltDVBr6mKbRvohxheJ9h1";
          const TIMEZONE = "Europe/Rome";
          // Rolling de-duplication buffer. Spotify only returns the last 50 plays,
          // so remembering the newest 300 ROSALÍA plays is more than enough.
          const BUFFER_SIZE = 300;

          function readJson(path, fallback) {
            try { return JSON.parse(fs.readFileSync(path, "utf8")); } catch (e) { return fallback; }
          }

          // YYYY-MM-DD for a timestamp, in the Europe/Rome timezone
          function localDate(ts) {
            return new Intl.DateTimeFormat("en-CA", {
              timeZone: TIMEZONE, year: "numeric", month: "2-digit", day: "2-digit"
            }).format(new Date(ts));
          }

          // Shift a YYYY-MM-DD string by n days (pure calendar math, no timezone issues)
          function addDays(dateStr, n) {
            const d = new Date(dateStr + "T00:00:00Z");
            d.setUTCDate(d.getUTCDate() + n);
            return d.toISOString().slice(0, 10);
          }

          // Tell the commit step whether there is anything to commit
          function setOutput(name, value) {
            if (process.env.GITHUB_OUTPUT) fs.appendFileSync(process.env.GITHUB_OUTPUT, `${name}=${value}\n`);
          }

          const sleep = ms => new Promise(r => setTimeout(r, ms));

          // fetch + JSON parse, retried on transient failures: network errors, 429, 5xx,
          // or an empty/invalid body (Spotify occasionally returns these for a moment).
          // Other errors (bad token, bad request) are returned as-is so the caller fails fast.
          const RETRY_DELAYS = [5000, 15000];
          async function fetchJson(label, url, options) {
            for (let attempt = 1; ; attempt++) {
              let problem;
              try {
                const res = await fetch(url, options);
                const text = await res.text();
                let data = null;
                try { data = text ? JSON.parse(text) : null; } catch (e) {}
                const transient = res.status === 429 || res.status >= 500 || (res.ok && data === null && res.status !== 204);
                if (!transient) return { res, data: data || {} };
                problem = `HTTP ${res.status}, body: ${text.slice(0, 200) || "(empty)"}`;
              } catch (err) {
                problem = `network error: ${err.message}`;
              }
              if (attempt > RETRY_DELAYS.length) throw new Error(`${label} failed after ${attempt} attempts (${problem})`);
              console.log(`${label} attempt ${attempt} failed (${problem}), retrying in ${RETRY_DELAYS[attempt - 1] / 1000}s`);
              await sleep(RETRY_DELAYS[attempt - 1]);
            }
          }

          async function getAccessToken() {
            const { res, data } = await fetchJson("Token refresh", "https://accounts.spotify.com/api/token", {
              method: "POST",
              headers: {
                "Content-Type": "application/x-www-form-urlencoded",
                "Authorization": "Basic " + Buffer.from(process.env.SPOTIFY_CLIENT_ID + ":" + process.env.SPOTIFY_CLIENT_SECRET).toString("base64")
              },
              body: new URLSearchParams({
                grant_type: "refresh_token",
                refresh_token: process.env.SPOTIFY_REFRESH_TOKEN
              })
            });
            if (!res.ok || !data.access_token) throw new Error(`Token refresh failed (HTTP ${res.status}): ` + JSON.stringify(data));
            return data.access_token;
          }

          async function run() {
            const token = await getAccessToken();
            const { res: spotifyRes, data: spotifyData } = await fetchJson("Spotify recently-played",
              "https://api.spotify.com/v1/me/player/recently-played?limit=50",
              { headers: { "Authorization": "Bearer " + token } });
            if (!spotifyRes.ok) throw new Error(`Spotify API error (HTTP ${spotifyRes.status}): ` + JSON.stringify(spotifyData));

            const core = readJson("./last_played.json", {});
            // history.json is the permanent record of plays per day. It is only ever
            // incremented, never rebuilt, so old days are never lost.
            const history = readJson("./history.json", {});
            const seen = new Set(core.tracked_timestamps || []);

            // 1. Find ROSALÍA plays (Spotify returns newest first)
            const rosaliaItems = (spotifyData.items || []).filter(item =>
              item.track && item.track.artists.some(a => a.id === ROSALIA_ID)
            );

            // 2. Count plays we have not seen before
            let newPlays = 0;
            const newTracks = [];
            for (const item of rosaliaItems) {
              if (seen.has(item.played_at)) continue;
              seen.add(item.played_at);
              const day = localDate(item.played_at);
              history[day] = (history[day] || 0) + 1;
              newPlays++;
              newTracks.push({
                played_at: item.played_at,
                track_name: item.track.name,
                album_name: item.track.album.name,
                album_art: item.track.album.images[0]?.url || "",
                spotify_url: item.track.external_urls?.spotify || ""
              });
            }

            // Early exit: no new ROSALÍA plays and the heartbeat was already written today,
            // so every derived value would come out the same. Nothing to write or commit.
            // (The first run of each day still goes through, which also lets a streak
            // drop to 0 after a day without plays.)
            const today = localDate(new Date());
            const heartbeatToday = core.last_successful_run && localDate(core.last_successful_run) === today;
            if (newPlays === 0 && heartbeatToday) {
              setOutput("changed", "false");
              console.log("No new ROSALÍA plays, nothing to update.");
              return;
            }

            // 3. Latest track (only replace it with something newer)
            const newest = rosaliaItems[0];
            if (newest && (!core.latest_track || newest.played_at > core.latest_track.timestamp)) {
              core.latest_track = {
                timestamp: newest.played_at,
                track_name: newest.track.name,
                album_name: newest.track.album.name,
                album_art: newest.track.album.images[0]?.url || "",
                spotify_url: newest.track.external_urls?.spotify || "",
                album_url: newest.track.album.external_urls?.spotify || ""
              };
            }

            // 4. Keep only the newest BUFFER_SIZE timestamps
            const trackedTimestamps = [...seen].sort().reverse().slice(0, BUFFER_SIZE);

            // 5. Streaks, computed on Europe/Rome calendar days
            const days = Object.keys(history).filter(d => history[d] > 0).sort();

            let longest = { count: 0, start_date: "", end_date: "" };
            let cur = null;
            for (const d of days) {
              if (cur && addDays(cur.end_date, 1) === d) {
                cur.end_date = d;
                cur.count++;
              } else {
                cur = { count: 1, start_date: d, end_date: d };
              }
              if (cur.count >= longest.count) longest = { ...cur };
            }

            // The last run is still "active" if it ended today or yesterday
            const active = cur && cur.end_date >= addDays(today, -1) ? cur : null;

            // Every play of the active streak, oldest first. Starts over when the streak breaks.
            const streakTracks = active
              ? [...(core.streak_tracks || []), ...newTracks]
                  .filter(t => localDate(t.played_at) >= active.start_date)
                  .sort((a, b) => a.played_at.localeCompare(b.played_at))
              : [];

            // 6. Peak volume (best single day)
            let peak = { count: 0, date: "" };
            for (const [d, c] of Object.entries(history)) {
              if (c > peak.count) peak = { count: c, date: d };
            }

            // 7. Heartbeat: only bumped once per day so we do not commit every 15 minutes
            const lastRun = heartbeatToday ? core.last_successful_run : new Date().toISOString();

            const sortedHistory = {};
            Object.keys(history).sort().reverse().forEach(k => { sortedHistory[k] = history[k]; });
            fs.writeFileSync("./history.json", JSON.stringify(sortedHistory, null, 2) + "\n");

            fs.writeFileSync("./last_played.json", JSON.stringify({
              current_streak: active ? active.count : 0,
              active_streak: active ? { start_date: active.start_date, end_date: active.end_date } : null,
              longest_streak: longest,
              peak_volume: peak,
              latest_track: core.latest_track || null,
              streak_tracks: streakTracks,
              last_successful_run: lastRun,
              tracked_timestamps: trackedTimestamps
            }, null, 2) + "\n");

            setOutput("changed", "true");
            console.log(`Done. New plays: ${newPlays}. Current streak: ${active ? active.count : 0}.`);
          }

          run().catch(err => { console.error("Error updating tracker:", err); process.exit(1); });
          '

      - name: Commit and push changes
        if: steps.tracker.outputs.changed == 'true'
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add last_played.json history.json
          git diff --cached --quiet || (git commit -m "Update streak stats & history [skip ci]" && git push)
